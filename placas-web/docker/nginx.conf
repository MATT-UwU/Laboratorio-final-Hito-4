# nginx interno del peaje. El nginx del host termina el TLS y hace proxy a 127.0.0.1:8081.
map $http_x_forwarded_proto $fwd_https {
    https   on;
    default "";
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    # Resolver de Docker: si el contenedor app cambia de IP al reiniciarse, nginx la vuelve a resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;          # fotos de la app

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Real-IP;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Panel en tiempo real (SSE): sin buffer para que los eventos lleguen al instante
    location = /pasos/stream {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $fwd_https;
        fastcgi_buffering off;
        fastcgi_read_timeout 600s;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTPS $fwd_https;
        fastcgi_read_timeout 150s;      # la inferencia en Colab puede tardar
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
